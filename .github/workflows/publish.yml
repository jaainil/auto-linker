name: Semantic release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the next semantic release without publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'jaainil/auto-linker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - run: npm ci
      - run: npm run prepack
      - run: node examples/basic.mjs
      - run: node evaluation/evaluate.mjs
      - name: Verify CommonJS export
        run: node --input-type=commonjs -e "const {autoLink}=require('.'); if(autoLink({content:'<p>AI automation</p>',pages:[{url:'https://example.com/ai',title:'AI automation'}]}).links.length!==1) process.exit(1)"
      - run: npm pack --dry-run

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url: semantic-release handles npm OIDC authentication.
      - run: npm ci
      - run: npm run build
      - name: Preview semantic release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm run release:dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish semantic release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
