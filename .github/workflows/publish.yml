name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version already committed in package/package.json (no automatic bump)'
        required: true
        default: '0.1.0'
        type: string
      dry_run:
        description: 'Validate and pack without publishing'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'jaainil/auto-linker' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - name: Verify release version
        env:
          RELEASE_REF: ${{ github.ref }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const expected = process.env.RELEASE_REF.startsWith('refs/tags/')
            ? process.env.RELEASE_REF.slice('refs/tags/v'.length)
            : process.env.EXPECTED_VERSION;
          if (pkg.name !== '@imjp/auto-linker' || pkg.version !== expected) {
            throw new Error(`Release version ${expected} does not match ${pkg.name}@${pkg.version}`);
          }
          JS
      - run: npm ci
      - run: npm run prepack
      - run: node examples/basic.mjs
      - run: node evaluation/evaluate.mjs
      - name: Verify CommonJS export
        run: node --input-type=commonjs -e "const {autoLink}=require('.'); if(autoLink({content:'<p>AI automation</p>',pages:[{url:'https://example.com/ai',title:'AI automation'}]}).links.length!==1) process.exit(1)"
      - run: npm pack --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - name: Verify package and build
        run: npm run prepack
      - name: Preview publication
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run
      - name: Publish public package with provenance
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: npm publish --access public --provenance
      - name: Summary
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const status = process.env.DRY_RUN === 'true' ? 'Dry run; nothing published' : 'Published';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${status}: ${name}@${version}\n`);
          JS
