name: Library checks
on:
  push:
    paths: ['package/**', '.github/workflows/package.yml']
  pull_request:
    paths: ['package/**', '.github/workflows/package.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
          cache-dependency-path: package/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node examples/basic.mjs
      - run: node evaluation/evaluate.mjs
      - run: node --input-type=commonjs -e "const {autoLink}=require('.'); if(autoLink({content:'<p>AI automation</p>',pages:[{url:'https://example.com/ai',title:'AI automation'}]}).links.length!==1) process.exit(1)"
      - run: npm pack --dry-run
